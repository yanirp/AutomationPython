name: Playwright Python Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install MS SQL ODBC Driver (Linux)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          sudo apt-get install -y unixodbc-dev

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-freefont-ttf fonts-dejavu fonts-noto fonts-noto-cjk fonts-noto-color-emoji

      - name: Run ONLY test_standing_order_page.py
        env:
          CI: true
        run: |
          xvfb-run pytest tests/test_standing_order_page.py --headed --slowmo 100 || true

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ci-debug-screenshot
          path: ci_debug_screenshot.png

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ci-debug-html
          path: ci_debug_page.html
