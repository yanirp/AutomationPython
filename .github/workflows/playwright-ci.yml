name: Playwright Python Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Install MS SQL ODBC Driver (Linux)
        run: |
          # Add Microsoft's package repository
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          # Accept EULA and install the driver
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          # Optional: install unixodbc-dev if needed for pyodbc build
          sudo apt-get install -y unixodbc-dev

      - name: Run ONLY test_authority_page.py
        env:
          CI: true
        run: |
          xvfb-run pytest tests/test_authority_page.py --headed --slowmo 50
